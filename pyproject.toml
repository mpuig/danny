[project]
name = "jev"
version = "0.1.0"
description = "Open-source System One model: calibrated typed decisions (choice/score/noul) via logit readout on small LLMs, built on Apple MLX"
requires-python = ">=3.11"
dependencies = [
    "mlx-lm>=0.22",
    "datasets>=3.0",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev"]
