[project]
name = "system-one"
version = "0.1.0"
description = "system-one — an open-source System One model (Kahneman's term for the fast judgment faculty): calibrated typed decisions (choice/score/noul) via logit readout on small fine-tuned LLMs, built on Apple MLX"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Marc Puig", email = "marc.puig@gmail.com"}]
requires-python = ">=3.11"

dependencies = [
    "mlx-lm>=0.22",
    "datasets>=3.0",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.urls]
Repository = "https://github.com/mpuig/system-one"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev"]
